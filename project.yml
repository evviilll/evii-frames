name: EviiFrames
options:
  bundleIdPrefix: com.evii
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: YES
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
targets:
  EviiFrames:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EviiFrames
        excludes:
          - "Resources/**"
    resources:
      - path: EviiFrames/Resources/Assets.xcassets
    info:
      path: EviiFrames/Info.plist
      properties:
        CFBundleDisplayName: Evii Frames
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evii.frames
        PRODUCT_NAME: EviiFrames
        PRODUCT_MODULE_NAME: EviiFrames
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: EviiFrames/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    postBuildScripts:
      - name: Copy RIFE models
        basedOnDependencyAnalysis: false
        script: |
          MODELS="${SRCROOT}/EviiFrames/Resources/Models"
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "${DEST}"
          if [ -d "${MODELS}" ]; then
            for model in "${MODELS}"/*.mlmodelc; do
              if [ -d "${model}" ]; then
                name="$(basename "${model}")"
                rm -rf "${DEST}/${name}"
                cp -R "${model}" "${DEST}/${name}"
              fi
            done
          fi
  EviiFramesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    hostApplication: EviiFrames
    sources:
      - path: EviiFramesTests
    dependencies:
      - target: EviiFrames
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evii.frames.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/EviiFrames.app/EviiFrames"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
schemes:
  EviiFrames:
    build:
      targets:
        EviiFrames: all
        EviiFramesTests: [test]
    test:
      targets:
        - EviiFramesTests
      gatherCoverageData: false
    archive:
      config: Release
